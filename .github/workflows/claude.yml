name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tag-mode defaults omit Task/Skill/gh, so "@claude /review-pr"
          # could never expand the command, spawn the reviewer subagents, or
          # read the PR diff. The inline-comment MCP server is only installed
          # when its tool is named here; without it, inline review comments
          # are impossible.
          # --append-system-prompt: subagents default to running in the
          # background, and headless runs exit at turn end — killing them
          # before they report.
          claude_args: >-
            --max-turns 60
            --allowedTools 'Skill,Task,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment'
            --append-system-prompt 'This is a headless CI run: the process exits the moment you end your turn, killing any background tasks. Launch subagents in a single message with run_in_background: false (they still run in parallel) and do not end your turn until every subagent has returned and all requested output is posted.'