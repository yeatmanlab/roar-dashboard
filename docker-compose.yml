name: roar-platform

# Local full-stack development: Postgres, OpenFGA, and the Firebase Auth emulator.
#
# Usage:
#   docker compose up -d --wait

services:
  postgres:
    container_name: roar-postgres
    image: postgres:18
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${ROAR_PG_PORT:-5432}:5432"
    volumes:
      # Persist database data across `docker compose down` — the Auth emulator
      # already persists its users, so without this the two drift apart after a
      # down/up (emulator users exist, their DB rows don't). The postgres:18
      # image expects the mount at /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h forces a TCP probe: during first-boot init the entrypoint runs a
      # temporary socket-only server, which plain pg_isready reports as ready
      # before dependents can actually connect over TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  # OpenFGA schema migrations — runs once against the roar_openfga database
  # created by the Postgres init script. Must complete before the server starts.
  openfga-migrate:
    container_name: roar-openfga-migrate
    image: openfga/openfga:v1.12.1
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://${PG_USER:-postgres}:${PG_PASSWORD:-postgres}@postgres:5432/roar_openfga

  # Postgres-backed OpenFGA — FGA data persists across container restarts.
  openfga:
    container_name: roar-openfga
    image: openfga/openfga:v1.12.1
    command: run
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ROAR_FGA_PORT:-4010}:8080"
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://${PG_USER:-postgres}:${PG_PASSWORD:-postgres}@postgres:5432/roar_openfga
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Shared emulator image (docker/firebase-emulator) — same image and config as
  # the assessment stack. Auth only: recording uploads go through the backend to
  # fake-gcs-server below, so no Storage emulator is needed and the image carries
  # no JRE.
  firebase-auth-emulator:
    container_name: roar-firebase-auth
    build: docker/firebase-emulator
    # Rebuild on every `up` (layer-cached, seconds): compose never rebuilds an
    # existing image on its own, so a cached image from an earlier revision of
    # this Dockerfile would keep running.
    pull_policy: build
    command: >
      emulators:start
        --only auth
        --project ${GCLOUD_PROJECT:-demo-roar}
        --config /firebase.json
        --import /emulator-data
        --export-on-exit /emulator-data
    ports:
      - "127.0.0.1:${ROAR_AUTH_PORT:-9099}:9099"
      - "127.0.0.1:${ROAR_AUTH_UI_PORT:-9999}:9000"
    volumes:
      - ./docker/firebase-emulator/firebase.json:/firebase.json:ro
      - firebase-auth-data:/emulator-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9099/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 45s

  # Local stand-in for Google Cloud Storage. The backend mints V4 signed upload
  # URLs and the browser PUTs to them directly, so dev needs something that speaks
  # the GCS API — not Firebase Storage, which the client no longer touches.
  #
  # ROAR_GCS_PORT overrides the published port, but the backend's GCS_API_ENDPOINT
  # (apps/backend/.env.example, and the seeder's default) is a separate value — change
  # one and seeding and URL signing stop reaching the container. Override both or neither.
  #
  # It validates nothing: signatures, Content-Type, Content-Length and expiry are
  # all accepted regardless. So this exercises the shape of the upload flow, never
  # its enforcement — that is the backend's boundary validation plus real GCS.
  fake-gcs:
    container_name: roar-fake-gcs
    image: fsouza/fake-gcs-server:1.56.1
    command: >
      -scheme http
      -host 0.0.0.0
      -port 4443
      -public-host 127.0.0.1:${ROAR_GCS_PORT:-4443}
      -backend filesystem
      -filesystem-root /data
    ports:
      - "127.0.0.1:${ROAR_GCS_PORT:-4443}:4443"
    volumes:
      - fake-gcs-data:/data
    healthcheck:
      # busybox wget, not curl: the fake-gcs-server image is Alpine-based and ships
      # neither. A curl probe exits 127, so the container would never report healthy
      # and anything waiting on service_healthy would never start.
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:4443/storage/v1/b?project=demo-roar' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
    name: roar-postgres-data
  fake-gcs-data:
    name: roar-fake-gcs-data
  firebase-auth-data:
