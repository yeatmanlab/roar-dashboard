name: roar-assessment

# ──────────────────────────────────────────────────────────────────────────────
# Assessment environment — full local stack for running ROAR assessments.
#
# Start (run from an assessment directory, e.g. apps/assessments/roar-pa):
#   npm start
#   (runs the assessment CLI: packages/assessment-dev-cli)
#
# Stop and delete data (run from an assessment directory):
#   npm stop
#
# Rebuild images after pulling new code (run from an assessment directory):
#   npm run rebuild
#
# Service dependency order:
#   assessment-db (healthy) → assessment-db-migrate (completed)
#                           → firebase-emulator (healthy)
#                           → backend (healthy)
#                           → assessment dev server (on host)
#
# Requires Docker Compose v2 (docker compose, not docker-compose).
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ────────────────────────────────────────────────────────────────────────────
  # Ephemeral PostgreSQL instance.
  # Uses the shared init script (docker/postgres) — the same one the platform
  # stack runs — which creates the databases and provisions the postgres_fdw
  # prerequisites over the Unix socket at first boot. The extra databases it
  # creates (test + OpenFGA) are unused here and harmless.
  #
  # Published on host port ${ASSESSMENT_PG_PORT:-5433} — deliberately NOT the
  # standard 5432 — so this ephemeral stack can run alongside a persistent
  # platform-dev Postgres on 5432 (see docker-compose.yml, ROAR_PG_PORT).
  # The assessment CLI exports the same variable (packages/assessment-dev-cli),
  # so the port the scripts connect to and the port Compose publishes always match.
  # ────────────────────────────────────────────────────────────────────────────
  assessment-db:
    container_name: assessment-db
    image: postgres:18
    healthcheck:
      # -h forces a TCP probe: during first-boot init the entrypoint runs a
      # temporary socket-only server, which plain pg_isready reports as ready —
      # assessment-db-migrate would then start before it can connect over TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host side defaults to 5433 to coexist with a persistent Postgres on 5432.
      - "127.0.0.1:${ASSESSMENT_PG_PORT:-5433}:5432"
    volumes:
      # Explicitly named (mirroring the platform stack's roar-postgres-data)
      # rather than compose's auto <project>_<key> prefix. The name changed from
      # the auto-generated roar-assessment_postgres-18-data — the "18" marker
      # forced a fresh volume for the Postgres 17→18 bump and has done its job;
      # the CLI's delete path still removes the legacy names. The postgres:18
      # image expects the mount at /var/lib/postgresql (not .../data); init
      # scripts only run when the data directory is empty.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────────────
  # One-shot migration runner.
  # Applies all Drizzle migrations and seeds the assessment task data (FDW
  # prerequisites are provisioned by the Postgres init script). ASSESSMENT_NAME
  # is set by the assessment CLI's start command and drives the dev:seed:tasks --task
  # ${ASSESSMENT_NAME} script. Exits 0 on success.
  # ────────────────────────────────────────────────────────────────────────────
  assessment-db-migrate:
    container_name: assessment-db-migrate
    build:
      context: .
      dockerfile: assessment.Dockerfile
      target: assessment-runtime
    working_dir: /app/apps/backend
    command: >
      sh -c "
        npm run db:migrate &&
        npm run dev:seed:tasks -- --task ${ASSESSMENT_NAME:-} &&
        npm run dev:seed:buckets
      "
    environment:
      ASSESSMENT_NAME: ${ASSESSMENT_NAME:-}
      CORE_DATABASE_URL: postgres://postgres:postgres@assessment-db:5432/roar_core
      ASSESSMENT_DATABASE_URL: postgres://postgres:postgres@assessment-db:5432/roar_assessment
      TASK_VARIANT_PARAMETERS_FILE: /app/assessment-config/taskVariantParameters.json
      # Bucket seeding reaches fake-gcs over the container network, not the
      # published host port.
      GCS_API_ENDPOINT: http://fake-gcs:4443
    volumes:
      - ./apps/assessments/${ASSESSMENT_NAME:-}:/app/assessment-config:ro
    depends_on:
      assessment-db:
        condition: service_healthy
      fake-gcs:
        condition: service_healthy
    # One-shot service — no restart policy.

  # ────────────────────────────────────────────────────────────────────────────
  # Firebase Auth emulator.
  # Uses the shared emulator image (docker/firebase-emulator) with this stack's
  # own config, firebase.assessment.json. The ports are deliberately shifted

  # from the canonical ones (9097/9002 instead of 9099/9999) so this
  # stack runs in parallel with the platform dev stack.
  #
  # The auth port must be shifted IN THE CONFIG, not remapped at the
  # Docker boundary (9097:9099): the Emulator UI is a browser-side app that
  # builds emulator URLs from the ports firebase.json advertises, so under a
  # shifted mapping the UI at :9002 would query 127.0.0.1:9099 — the platform
  # stack's emulator — and show the wrong stack's users. Only the UI's own port
  # stays internal-canonical (9002:9000); its API calls are relative. The host
  # values must match apps/assessments/shared/devEmulatorHost.cjs, which dev
  # bundles default to. emulatorPortConfig.test.js asserts all of this agrees.
  # Assessments connect via FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9097; the

  # Emulator UI is on :9002. Recording uploads go through the backend to

  # fake-gcs below, not through this emulator.
  # ────────────────────────────────────────────────────────────────────────────
  firebase-emulator:
    container_name: firebase-emulator
    build: docker/firebase-emulator
    # Rebuild on every `up` (layer-cached, seconds): compose never rebuilds an

    # existing image on its own, so a cached image from an earlier revision of

    # this Dockerfile would keep running.
    pull_policy: build
    volumes:
      - ./docker/firebase-emulator/firebase.assessment.json:/firebase.json:ro
    command: >
      emulators:start
        --only auth
        --project demo-roar
        --config /firebase.json
    ports:
      # Identity mappings — the container ports already carry the shifted values
      # from firebase.assessment.json (see the service comment above for why).
      - "127.0.0.1:9097:9097"
        # Emulator UI.
      - "127.0.0.1:9002:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9097/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────────────
  # Backend API server.
  # Runs in production mode (HTTP, no TLS) on container port 4000, published on host 4002.
  # FGA vars are set to placeholder values — anonymous assessment runs do not
  # trigger FGA calls (same-user access check short-circuits before any FGA call).
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    container_name: assessment-backend
    build:
      context: .
      dockerfile: assessment.Dockerfile
      target: assessment-runtime
    environment:
      NODE_ENV: production
      PORT: "4000"
      CORE_DATABASE_URL: postgres://postgres:postgres@assessment-db:5432/roar_core
      ASSESSMENT_DATABASE_URL: postgres://postgres:postgres@assessment-db:5432/roar_assessment
      # Canonical project identifier for emulated Firebase projects
      # Should match FIREBASE_EMULATOR_PROJECT_ID constant in @assessment-schema/src/firebase-emulator.ts
      GOOGLE_CLOUD_PROJECT: demo-roar
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9097
      # The webpack dev server proxies /v1 to the backend so CORS never applies
      # in this environment. This value just satisfies the production boot check
      # (ALLOWED_ORIGINS must be set when NODE_ENV=production).
      ALLOWED_ORIGINS: "http://localhost:8000"
      # Placeholder FGA config — the FGA client must be initialized at startup
      # (module-level service instantiation), but FGA is never actually called
      # for anonymous assessment runs (the same-user access check short-circuits
      # first). Deliberate: this stack ships no OpenFGA service — see
      # yeatmanlab/roar-project-management#1999.
      FGA_API_URL: http://placeholder:5050
      FGA_STORE_ID: "00000000000000000000000000"
      FGA_MODEL_ID: "00000000000000000000000000"
    ports:
      # Host 4002 — the platform dev backend owns 4000, and the stacks run in
      # parallel. Must match the BACKEND_URL the assessment CLI exports
      # (packages/assessment-dev-cli).
      - "127.0.0.1:4002:4000"
    depends_on:
      assessment-db-migrate:
        condition: service_completed_successfully
      firebase-emulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────────────
  # Local stand-in for Google Cloud Storage.
  # The backend mints V4 signed upload URLs and the browser PUTs to them, so dev
  # needs something speaking the GCS API — not Firebase Storage, which the client
  # no longer touches. Published on 4445 rather than the canonical 4443 so this
  # stack runs in parallel with the platform dev stack, matching the port-shifting
  # convention above. `-public-host` must carry the published port, since it is
  # what the backend bakes into the signed URL the browser follows.
  #
  # It validates nothing: signatures, Content-Type, Content-Length and expiry are
  # all accepted regardless. This exercises the shape of the upload flow, never
  # its enforcement — that is the backend's boundary validation plus real GCS.
  # ────────────────────────────────────────────────────────────────────────────
  fake-gcs:
    container_name: assessment-fake-gcs
    image: fsouza/fake-gcs-server:1.56.1
    command: >
      -scheme http
      -host 0.0.0.0
      -port 4443
      -public-host 127.0.0.1:4445
      -backend filesystem
      -filesystem-root /data
    ports:
      - "127.0.0.1:4445:4443"
    volumes:
      - fake-gcs-data:/data
    healthcheck:
      # busybox wget, not curl: the fake-gcs-server image is Alpine-based and ships
      # neither. A curl probe exits 127, so the container would never report healthy
      # and anything waiting on service_healthy would never start.
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:4443/storage/v1/b?project=demo-roar' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
    name: roar-assessment-postgres-data
  fake-gcs-data:
    name: roar-assessment-fake-gcs-data
